# Local services only. Ports bind to 127.0.0.1 and differ from the agencia project's so both can run at once.
name: aim

x-n8n: &n8n
  build: ./automations
  image: aim-n8n:local
  environment: &n8n-env
    # The site + API of `pnpm dev:full` (127.0.0.1:8789 on the host; Docker Desktop on WSL2 reaches it here).
    AIM_SITE_ORIGIN: ${AIM_SITE_ORIGIN:-http://host.docker.internal:8789}
    N8N_WEBHOOK_URL: http://127.0.0.1:5679/
    # host.docker.internal is a private address, which the SSRF protection would block (on in Render).
    N8N_SSRF_PROTECTION_ENABLED: 'false'
  extra_hosts: ['host.docker.internal:host-gateway']
  ports: ['127.0.0.1:5679:5678']

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: aim
      POSTGRES_PASSWORD: aim
      POSTGRES_DB: aim
    ports: ['127.0.0.1:54321:5432']
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aim']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8.1-alpine
    ports: ['127.0.0.1:6381:6379']

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1026:1025', '127.0.0.1:8026:8025']

  # Phase 4: the Lab's "Automatización en vivo" (docs/AUTOMATIZACION.md, automations/README.md).
  # The same image as Render: stateless, webhook only, no editor. With `pnpm dev:full` running:
  #   docker compose --profile automations up -d --build n8n
  n8n:
    <<: *n8n
    profiles: [automations]

  # The same image with the n8n editor, to change the flow and export it (automations/README.md).
  # Uses the same port: run either n8n or n8n-editor.
  #   docker compose --profile n8n-editor up -d --build n8n-editor   → http://localhost:5679
  n8n-editor:
    <<: *n8n
    profiles: [n8n-editor]
    environment:
      <<: *n8n-env
      AIM_N8N_MODE: editor
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      N8N_SECURE_COOKIE: 'false'
    volumes: [n8n-editor:/home/node/.n8n]

volumes:
  postgres:
  n8n-editor:
