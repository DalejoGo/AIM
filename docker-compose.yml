# Local services only. Ports bind to 127.0.0.1 and differ from the agencia project's so both can run at once.
name: aim

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: aim
      POSTGRES_PASSWORD: aim
      POSTGRES_DB: aim
    ports: ['127.0.0.1:54321:5432']
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aim']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8.1-alpine
    ports: ['127.0.0.1:6381:6379']

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1026:1025', '127.0.0.1:8026:8025']

  # The n8n editor, to design the Lab's "Automatización en vivo" flow and export it to the repo
  # (automations/README.md). The site runs the exported flow itself (DEC-023); n8n does not run in production.
  #   docker compose --profile n8n-editor up -d --build n8n-editor   → http://localhost:5679
  n8n-editor:
    build: ./automations
    image: aim-n8n:local
    profiles: [n8n-editor]
    environment:
      AIM_N8N_MODE: editor
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      N8N_SECURE_COOKIE: 'false'
      # Required by the image. The report nodes post here only if you run the whole flow from the editor.
      AIM_SITE_ORIGIN: http://host.docker.internal:8789
      N8N_SSRF_PROTECTION_ENABLED: 'false'
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:5679:5678']
    volumes: [n8n-editor:/home/node/.n8n]

volumes:
  postgres:
  n8n-editor:
