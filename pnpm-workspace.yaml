packages:
  - apps/*
  - packages/*

# Supply chain (DEC-002): nothing published in the last 14 days (20160 min).
# Exceptions ONLY for security patches; each one is listed in docs/DECISIONES.md.
minimumReleaseAge: 20160

onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@biomejs/biome'
  - '@swc/core'

# Telemetry postinstall from swagger-ui-dist; never needed.
ignoredBuiltDependencies:
  - '@scarf/scarf'
